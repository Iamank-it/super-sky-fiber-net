services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssfn-web-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://ssfn_user:ssfn_secure_password@postgres:5432/ssfn_db?schema=public
      - ADMIN_SECRET_KEY=ssfn-jamshedpur-admin-2026
      - NEXT_PUBLIC_APP_URL=http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ssfn-postgres
    restart: always
    environment:
      POSTGRES_USER: ssfn_user
      POSTGRES_PASSWORD: ssfn_secure_password
      POSTGRES_DB: ssfn_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssfn_user -d ssfn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
